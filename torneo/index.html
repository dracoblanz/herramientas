<!doctype html>
<html lang="es" class="gated" data-gate="lista">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://*.firebaseio.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://mc-heads.net https://raw.githubusercontent.com https://*.googleusercontent.com https://www.gstatic.com; connect-src https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com; frame-src https://*.firebaseapp.com https://www.google.com https://recaptcha.google.com;">
<meta name="referrer" content="strict-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Torneo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://mc-heads.net">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="torneo.css">
</head>
<body>
<header class="shell gutter">
  <div class="shell-in">
    <div class="brand">
      <a class="back" href="../"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M8 1.5 3.5 6 8 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg> Herramientas</a>
      <h1>Torneo</h1>
    </div>
    <div class="tools-top">
      <div class="live" id="live"></div>
      <span class="sync" id="sync" aria-live="polite">Guardado en este navegador</span>
      <button class="btn sm" id="exportBtn" type="button">Exportar</button>
      <button class="btn sm" id="importBtn" type="button">Importar</button>
      <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
  </div>
</header>

<main class="gutter">
  <div id="setup" class="setup">
    <section class="panel cfg" aria-labelledby="cfgT">
      <h2 id="cfgT">Configuración</h2>
      <label class="f"><span>Nombre del torneo</span><input type="text" id="title" name="titulo" maxlength="48" placeholder="Copa PlayArt…" autocomplete="off"></label>
      <div class="f"><span id="fmtL">Formato</span><div class="fmts" id="format" role="radiogroup" aria-labelledby="fmtL"></div></div>
      <div class="grp-opts" id="grpOpts">
        <label class="f"><span>Jugadores por grupo</span><select id="gSize" name="por_grupo"></select></label>
        <label class="f"><span>Pasan por grupo</span><select id="gAdv" name="pasan"></select></label>
      </div>
      <div class="f"><span id="ordL">Sorteo</span><div class="chips" id="order" role="radiogroup" aria-labelledby="ordL"></div><small class="hint" id="ordHint"></small></div>
      <div class="f"><span id="thL">Color</span><div class="chips" id="theme" role="radiogroup" aria-labelledby="thL"></div></div>
      <div class="f"><span id="dcL">Decoración</span><div class="chips" id="deco" role="radiogroup" aria-labelledby="dcL"></div></div>
    </section>

    <section class="panel ppl" aria-labelledby="pplT">
      <div class="ph"><h2 id="pplT">Participantes</h2><span class="count" id="pplCount"></span></div>
      <form id="addP" class="addp" autocomplete="off" novalidate>
        <label class="f grow"><span>Nombre</span><input type="text" id="pName" name="nombre" maxlength="24" placeholder="Nombre o nick de Minecraft…" spellcheck="false"></label>
        <label class="check"><input type="checkbox" id="pMc" name="minecraft"> Es de Minecraft</label>
        <button class="btn primary" type="submit">Agregar</button>
      </form>
      <details class="bulk"><summary>Pegar varios a la vez</summary>
        <label class="f"><span>Uno por línea</span><textarea id="bulk" name="varios" rows="5" placeholder="Dracoblanz&#10;Octavio&#10;Pochan…" spellcheck="false"></textarea></label>
        <div class="row"><label class="check"><input type="checkbox" id="bulkMc" name="todos_minecraft"> Todos son de Minecraft</label><button class="btn sm" type="button" id="bulkAdd">Agregar todos</button></div>
      </details>
      <p class="msg" id="pMsg" aria-live="polite"></p>
      <ol class="plist" id="plist"></ol>
    </section>

    <div class="go"><button class="btn primary big" type="button" id="start">Sortear y empezar</button><p class="msg" id="startMsg" aria-live="polite"></p></div>
  </div>

  <div id="board" class="board" hidden>
    <div class="bar">
      <div class="bt"><h2 id="bTitle"></h2><span class="count" id="bInfo"></span></div>
      <div class="bacts" id="bActs"></div>
    </div>
    <div class="bracket" id="bracket"></div>
  </div>
  <p class="note">Caras de Minecraft de <a href="https://mc-heads.net" rel="noopener">mc-heads.net</a> según el nombre de la cuenta.</p>
</main>

<dialog id="match" class="mdlg" aria-labelledby="mTitle"><div class="mbox" id="mbox"></div></dialog>

<script src="../shared/storage.js"></script>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/sync.js"></script>
<script src="../shared/gate.js"></script>
<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
