<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';">
<meta name="referrer" content="strict-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Herramientas PlayArt</title>
<meta name="theme-color" content="#171717">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --ground:#0a0a0a;--panel:#171717;--fg:#f5f5f5;--muted:#a3a3a3;--line:#404040;--accent:#b37bff;--accent-soft:#2a1f3a;--ok:#c9a8ff;--path-edge:#593d7f;
  --display:"Pixelify Sans",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
::selection{background:var(--accent);color:#0a0a0a}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{background:var(--panel);color:var(--fg);border-bottom:3px solid var(--accent)}
.shell-in,.wrap{max-width:1040px;margin:0 auto}
.shell-in{padding-top:36px;padding-bottom:30px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,6vw,56px);line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:12px 0 0;max-width:60ch;font-size:16px;text-wrap:pretty}
.wrap{padding-top:24px;padding-bottom:56px}
#q{width:100%;font:inherit;padding:11px 13px;border:2px solid var(--line);border-radius:0;background:var(--panel);color:var(--fg);margin-bottom:18px;min-height:44px}
#q::placeholder{color:var(--muted);opacity:1}
#q:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.tool{display:flex;flex-direction:column;gap:8px;padding:22px;background:var(--panel);border:2px solid var(--path-edge);outline:2px solid var(--line);outline-offset:-6px;border-radius:0;color:inherit;text-decoration:none;transition:border-color .15s,background-color .15s}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool h2{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;margin:0;text-wrap:balance}
.tool h2::before{content:"";width:14px;height:14px;flex:none;background:var(--accent);border:2px solid var(--path-edge)}
.tool p{margin:0;color:var(--muted);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:6px}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:0;background:var(--accent-soft);color:var(--accent);border:1px solid var(--path-edge)}
.saved{font-size:13px;color:var(--ok);font-weight:700}
.empty{color:var(--muted)}
footer{margin-top:40px;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:reduce){.tool{transition:none}}
</style>
</head>
<body>
<header class="shell gutter">
  <div class="shell-in">
    <h1>Herramientas PlayArt</h1>
    <p class="sub">Herramientas para partidas y streams. Para entrar a cada una inicia sesión con una cuenta invitada.</p>
  </div>
</header>
<main class="wrap gutter">
  <input id="q" type="search" name="buscar" placeholder="Buscar herramienta…" autocomplete="off" spellcheck="false" aria-label="Buscar herramienta">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No hay herramientas con ese nombre. Prueba con otra palabra.</p>
  <footer>playartonline.site</footer>
</main>
<script src="shared/storage.js"></script>
<script src="tools.js"></script>
<script src="main.js"></script>
</body>
</html>
