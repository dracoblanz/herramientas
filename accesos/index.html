<!doctype html>
<html lang="es" class="gated" data-gate="dueno">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; manifest-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://www.google.com https://*.firebaseio.com https://*.firebasedatabase.app; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.googleusercontent.com https://www.gstatic.com; connect-src https://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebaseio.com wss://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebaseinstallations.googleapis.com https://content-firebaseappcheck.googleapis.com https://www.google.com; frame-src https://*.firebaseapp.com https://www.google.com https://recaptcha.google.com;">
<meta name="referrer" content="strict-origin">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171717">
<title>Accesos · Herramientas PlayArt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --ground:#0a0a0a;--panel:#171717;--fg:#f5f5f5;--muted:#a3a3a3;--line:#404040;--line-strong:#737373;--accent:#b37bff;--accent-soft:#2a1f3a;--on-accent:#0a0a0a;--path-edge:#593d7f;
  --display:"Pixelify Sans",ui-sans-serif,system-ui,sans-serif;--body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.gated body>*:not(.gate){display:none!important}
html{-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit;touch-action:manipulation}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shell{background:var(--panel);border-bottom:3px solid var(--accent)}
.shell-in,main{max-width:720px;margin:0 auto}
.shell-in{padding-top:14px;padding-bottom:14px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.back{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;text-underline-offset:3px}
.back:hover{color:var(--accent);text-decoration:underline}
.back svg{vertical-align:-1px}
h1{font:700 clamp(24px,3vw,32px)/1.05 var(--display);margin:0}
h2{font:700 20px/1.1 var(--display);margin:0 0 4px}
.who{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
main{padding-top:20px;padding-bottom:48px;display:flex;flex-direction:column;gap:16px}
.panel{background:var(--panel);border:2px solid var(--path-edge);outline:2px solid var(--line);outline-offset:-6px;padding:20px 22px}
.panel>p{margin:0 0 14px;color:var(--muted);font-size:14px;text-wrap:pretty}
form{display:flex;flex-wrap:wrap;gap:8px}
label{flex-basis:100%;font-size:13px;font-weight:700}
input{flex:1 1 220px;min-width:0;padding:10px 12px;min-height:44px;border:2px solid var(--line);border-radius:0;background:var(--ground)}
input::placeholder{color:var(--muted);opacity:1}
.btn{font-weight:700;padding:8px 14px;min-height:44px;border-radius:0;border:2px solid var(--line);background:var(--panel);cursor:pointer}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:34px}
.btn.warn{border-color:#ef4444;color:#fca5a5}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:1.5em;margin:10px 0 0;font-size:14px;color:var(--muted)}
.msg.bad{color:#fca5a5}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
li{flex-wrap:wrap;gap:6px 12px}
li span{flex:1 1 100%;min-width:0;overflow-wrap:anywhere;font-weight:700}
li .eds{flex:1 1 auto}
li>.btn{margin-left:auto}
.eds{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:2px 14px;min-width:0}
.eds legend{float:left;font-size:12px;font-weight:700;color:var(--muted);margin-right:10px;padding:0;line-height:34px}
.ed{display:inline-flex;align-items:center;gap:6px;flex-basis:auto;font-size:13px;font-weight:400;color:var(--muted);cursor:pointer;min-height:34px}
.ed input{flex:none;width:18px;height:18px;min-height:0;padding:0;accent-color:var(--accent)}
@media (max-width:520px){li{flex-wrap:wrap}li span{flex-basis:100%}}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;margin:0}
</style>
</head>
<body>
<header class="shell gutter">
  <div class="shell-in">
    <div class="brand">
      <a class="back" href="../"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M8 1.5 3.5 6 8 10.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"/></svg> Herramientas</a>
      <h1>Accesos</h1>
    </div>
    <span class="who" id="who"></span>
    <button class="btn sm" type="button" id="out">Cerrar sesión</button>
  </div>
</header>
<main class="gutter">
  <section class="panel">
    <h2>Dar acceso</h2>
    <p>Escribe el correo de Google de la persona. Podrá entrar a las herramientas. Marca en qué herramientas puede editar tus salas en vivo.</p>
    <form id="add" novalidate>
      <label for="mail">Correo de Google</label>
      <input id="mail" name="correo" type="email" inputmode="email" autocomplete="off" spellcheck="false" placeholder="nombre@gmail.com…" required>
      <button class="btn primary" type="submit" id="addBtn">Dar acceso</button>
    </form>
    <p class="msg" id="msg" aria-live="polite"></p>
  </section>
  <section class="panel">
    <h2>Con acceso <span class="count" id="count"></span></h2>
    <ul id="list"></ul>
    <p class="empty" id="empty" hidden>Todavía no le diste acceso a nadie.</p>
  </section>
</main>
<script src="../shared/firebase-config.js"></script>
<script src="../shared/sync.js"></script>
<script src="../shared/gate.js"></script>
<script src="../tools.js"></script>
<script src="accesos.js"></script>
</body>
</html>
